<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Club portal</title><link rel="stylesheet" href="/style.css">
<style>body{background:var(--grey)}.pt{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.pn{background:var(--black);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px}.pn b{font:800 22px 'Barlow Condensed';padding:0 10px 14px}.pn a{padding:10px;border-radius:6px;text-decoration:none;color:#c3cad0}.pn a.on,.pn a:hover{background:var(--blue);color:#fff}.pm{padding:24px;max-width:900px}
.box{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px}label{display:block;font-weight:600;font-size:14px;margin:10px 0}input,select,textarea{display:block;width:100%;padding:9px;border:1px solid #c5ccd2;border-radius:6px;font:inherit;margin-top:4px;background:#fff}input[type=color]{height:42px;padding:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.sm{padding:6px 12px;font-size:14px}.err{color:#b3261e;font-weight:600}.ok{background:#e6f4f4;border-left:4px solid var(--teal);padding:12px;margin-bottom:12px;word-break:break-all}.login{max-width:380px;margin:60px auto}
h1{overflow-wrap:anywhere}.login h1{font-size:38px!important}
@media(max-width:760px){.pt{grid-template-columns:1fr}.pn{flex-direction:row;flex-wrap:wrap}}</style><script src="qrcode.js"></script></head><body><div id="app"></div><script>
const $=(s,e=document)=>e.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me,items=[],st={},tab,msg='';
async function api(p,method='GET',body){const r=await fetch('/api/'+p,{method,headers:{'content-type':'application/json'},body:body&&JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
const T={fixture:'Fixtures and results',news:'News',team:'Teams',member:'Committee',role:'Volunteer roles',doc:'Documents',sponsor:'Sponsors',page:'Extra pages',messages:'Messages',settings:'Settings',users:'Users'};
const tn=t=>t.name||'U'+t.age;const tl=s=>{const t=items.find(x=>x.kind=='team'&&x.slug==s);return t?tn(t):s};
const R={fixture:'admin editor coach',news:'admin editor coach',team:'admin editor',doc:'admin editor',sponsor:'admin editor',page:'admin editor',member:'admin editor',role:'admin editor',messages:'admin editor',settings:'admin',users:'admin'};
const can=k=>R[k].split(' ').includes(me.role);
const K={
fixture:{f:[['team','Team','team'],['opp','Opposition'],['date','Kick-off','datetime-local'],['venue','Venue'],['us','Jaguars score (competitive teams only)','number'],['them','Opposition score (competitive teams only)','number'],['report','Match report','textarea']],l:i=>`${i.date||''} · ${tl(i.team)} v ${i.opp} ${i.us!==''&&i.us!=null?i.us+'-'+i.them:''}`,desc:1},
news:{f:[['title','Title'],['date','Date','date'],['img','Photo','file'],['body','Story','textarea']],l:i=>`${i.date||''} · ${i.title}`,desc:1},
team:{f:[['name','Team name (leave blank to use U + age group, e.g. Mini Jags)'],['age','Age group (number only, e.g. 12; leave blank for Mini Jags)','number'],['type','Type','select',['Auto (by age)','Training only','Primary','Competitive']],['img','Team photo','file'],['coaches','Coaches and contacts','textarea'],['sessions','Training sessions (one per line: Day|Time|Location)','textarea'],['playDay','Default match day and time (e.g. Sunday 10:30am)'],['playVenue','Default match venue'],['gdFix','Game Day fixtures and results link (competitive teams)','url'],['gdLadder','Game Day league table link (competitive teams)','url'],['afterMatch','After-match function (where the team goes, e.g. Masons, Bell Lane)'],['afterMatchLink','After-match map or what3words link','url'],['volunteers','Volunteers (one per line: Role|Name, e.g. Water Carrier|Sam Smith)','textarea'],['icalUrl','Calendar feed link for fixtures (for teams without Game Day: an .ics or webcal link)','url'],['icalFilter','Count a calendar event as a fixture only if its title contains (recommended, e.g. match or v). Everything still shows on the Events page'],['info','About the team','textarea']],l:i=>(i.name||'U'+i.age)+' · '+(i.type&&i.type!='Auto (by age)'?i.type:(+i.age>=+(st.compAge||12)?'Competitive':'Primary'))},
member:{f:[['name','Name'],['role','Role'],['img','Photo','file'],['desc','About their role','textarea'],['order','Order on page','number']],l:i=>i.role+' · '+i.name},
role:{f:[['title','Role (e.g. Game Day Manager)'],['renew','When it renews (e.g. every year)'],['summary','What the role involves','textarea'],['how','How to register','textarea'],['links','Registration and training links (one per line: Label|https://link)','textarea'],['order','Order on page','number']],l:i=>i.title},
doc:{f:[['title','Title'],['group','Section','select',['Parents','Players','Coaches','Volunteers','Governance','Match day']],['url','File or link','file'],['note','Short description']],l:i=>`${i.group} · ${i.title}`},
page:{f:[['title','Page name (shown in the menu)'],['type','What is it?','select',['Link to another website','Page with text']],['url','Website address (for links)','url'],['body','Page text (for text pages; leave a blank line between paragraphs)','textarea'],['img','Picture (for text pages)','file'],['menu','Menu','select',['Show in menu','Hide from menu']],['order','Order in the menu (bigger numbers go later)','number']],l:i=>i.title+' · '+(i.type=='Page with text'?'/p/'+i.slug:'link, also /go/'+i.slug)},
sponsor:{f:[['name','Name'],['url','Website','url'],['logo','Logo','file']],l:i=>i.name}};
const DEF={visitorWelcome:'Welcome to Jaguar Park. Everything visiting teams and families need for match day is on this page. Please share it with your team.',parking:'Visiting teams, please park in the away car park (see the what3words location below).',sidelineDont:'No smoking\nNo vaping\nNo alcohol',tuckShop:'Hot and cold drinks and a large range of savoury and sweet snacks. We accept cash or card.'};
const S_F=[['club','Club name'],['season','Season'],['hero','Homepage headline'],['intro','Welcome text','textarea'],['heroImg','Homepage photo','file'],['heroOverlay','Blue tint over the homepage photo (percent, 0 to 100)','number'],['logo','Logo','file'],['email','Club email (contact form messages go here)'],['mailFrom','Send-from address on your Cloudflare domain (e.g. website@ackworthjaguars.co.uk)'],['turnstile','Turnstile site key (spam check on the contact form)'],['contactIntro','Contact page intro','textarea'],['address','Address (one line per row)','textarea'],['map','Google Maps link','url'],['w3w','what3words (Label|word.word.word, one per line)','textarea'],['visitorWelcome','Match day page: welcome message','textarea'],['parking','Match day: where visiting teams should park (one line each)','textarea'],['noParking','Match day: where NOT to park (one line each)','textarea'],['sidelineDo','Match day sideline: what people can do (one line each)','textarea'],['sidelineDont','Match day sideline: what people must not do (one line each)','textarea'],['tuckShop','Tuck shop description','textarea'],['facebook','Facebook link','url'],['instagram','Instagram link','url'],['youtube','YouTube link','url'],['messenger','Messenger link','url'],['joinUrl','Sign-up link','url'],['joinText','New starter steps (one per line)','textarea'],['compAge','Competitive from this age group (number, e.g. 12)','number'],['defaultRule','Default match day rule (shown on team pages)','textarea'],['blue','Royal blue','color'],['black','Black','color'],['teal','Teal accent (keep away from blue)','color']];
function fields(spec,d){return spec.map(([n,l,t,o])=>{const v=H(d[n]);let c;
if(t=='textarea')c=`<textarea name="${n}" rows="5">${v}</textarea>`;
else if(t=='team')c=`<select name="${n}">${items.filter(x=>x.kind=='team'&&x.type!='Training only').map(x=>`<option value="${H(x.slug)}" ${d[n]==x.slug?'selected':''}>${H(tn(x))}</option>`).join('')}</select>`;
else if(t=='select')c=`<select name="${n}">${o.map(x=>`<option ${d[n]==x?'selected':''}>${x}</option>`).join('')}</select>`;
else if(t=='file')c=`<input name="${n}" value="${v}" placeholder="Link, or choose a file below"><input type="file" data-f="${n}">`;
else c=`<input name="${n}" type="${t||'text'}" value="${v}">`;
return `<label>${l}${c}</label>`}).join('')}
function rollBox(k){if(k!='team')return;$('.pm').insertAdjacentHTML('beforeend','<div class="box"><h3>Game Day</h3><p>The site reads the league table and fixtures from Game Day for every team that has Game Day links, at 1pm and 8pm UK time each day. Use this to refresh straight away.</p><button class="btn k" id="gd">Refresh Game Day data now</button></div>');$('#gd').onclick=async()=>{$('#gd').textContent='Reading Game Day…';try{const j=await api('gameday/refresh','POST');msg=j.results.map(H).join('<br>')}catch(e){msg=H(e.message)}go('team')};if(me.role!='admin')return;$('.pm').insertAdjacentHTML('beforeend','<div class="box"><h3>New season</h3><p>Moves every team up one age group (U12 becomes U13). Coaches, photos, training and links stay with the squad. Add your new youngest team afterwards.</p><button class="btn k" id="ro">Move all teams up one age group</button></div>');$('#ro').onclick=async()=>{if(!confirm('Move every team up one age group?'))return;for(const t of items.filter(x=>x.kind=='team'&&x.age)){const{id,kind,sort,...d}=t;d.age=String(+d.age+1);await api('items/'+id,'PUT',{kind:'team',sort:d.age.padStart(2,'0'),data:d})}msg='All teams moved up one age group';go('team')}}
function qr(secret,user){const iss='Ackworth Jaguars',uri='otpauth://totp/'+encodeURIComponent(iss)+':'+encodeURIComponent(user)+'?secret='+secret+'&issuer='+encodeURIComponent(iss);const q=qrcode(0,'M');q.addData(uri);q.make();return q.createSvgTag(5,3).replace('<svg ','<svg style="width:220px;height:220px;background:#fff;display:block;margin:12px 0" ')}
const slug=t=>{let s=String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'page',b=s,n=2;while(items.some(x=>x.kind=='page'&&x.slug==s))s=b+'-'+n++;return s};
function inviteMsg(t,u,reset){const link=location.origin+'/admin/?invite='+t;return (reset?'Login reset for ':'Invite created for ')+'<b>'+H(u)+'</b>. Send them this private link (works once, for 7 days):<input readonly value="'+link+'" onclick="this.select()" style="margin-top:8px">'}
function qrScreen(r){$('#app').innerHTML=`<div class="box login"><h1>Add to authenticator</h1><p>Open your authenticator app (Google Authenticator, Microsoft Authenticator, Authy), choose add account, then <b>Scan a QR code</b> and scan this:</p>${qr(r.secret,r.username)}<p>Can't scan? Choose <b>enter a setup key</b>, pick time based, and type this key (capital letters and the numbers 2 to 7 only):</p><div class="ok"><b>${r.secret}</b></div><p>Next you log in with your username, password and the 6-digit code the app shows. This is only shown once.</p><button class="btn" onclick="location.href='/admin/'">Continue to log in</button></div>`}
async function acceptInvite(t){let i;try{i=await api('invite/'+t)}catch(e){return form('Invite problem','<p class="err">'+H(e.message)+'</p>','Go to login',async()=>{location.href='/admin/'})}
form(i.reset?'Reset your login':'Welcome','<p>Hello <b>'+H(i.username)+'</b>. Choose a password (10 characters or more). Next you will scan a QR code with your authenticator app.</p><label>Password<input name="password" type="password" autocomplete="new-password"></label><label>Repeat password<input name="password2" type="password" autocomplete="new-password"></label>','Continue',async d=>{if(d.password!==d.password2)throw new Error('The two passwords do not match');qrScreen(await api('invite/'+t,'POST',{password:d.password}))})}
function collect(box){const d={};box.querySelectorAll('[name]').forEach(e=>d[e.name]=e.value);return d}
async function shrink(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;const bm=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const png=f.type=='image/png';return await new Promise(r=>c.toBlob(b=>r(b||f),png?'image/png':'image/jpeg',0.85))}
function wireUpload(box){box.querySelectorAll('input[type=file]').forEach(f=>f.onchange=async()=>{const x0=f.files[0];if(!x0)return;const x=await shrink(x0);f.previousElementSibling.value='Uploading…';try{const r=await fetch('/api/upload',{method:'POST',headers:{'content-type':x.type,'x-name':encodeURIComponent(x0.name)},body:x});const j=await r.json();if(!r.ok)throw new Error(j.error);f.previousElementSibling.value=j.url}catch(e){f.previousElementSibling.value='';alert(e.message)}})}
function shell(h){$('#app').innerHTML=`<div class="pt"><aside class="pn"><b>Club portal</b>${Object.keys(T).filter(can).map(k=>`<a href="#" data-k="${k}" class="${k==tab?'on':''}">${T[k]}</a>`).join('')}<a href="/" target="_blank">View site</a><a href="#" id="lo">Log out (${H(me.username)})</a></aside><main class="pm"><h1 style="font-size:48px">${T[tab]}</h1>${msg?`<div class="ok">${msg}</div>`:''}${h}</main></div>`;msg='';
document.querySelectorAll('[data-k]').forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.k)});$('#lo').onclick=async e=>{e.preventDefault();await api('logout','POST');location.reload()};wireUpload(document)}
async function load(){const j=await api('public?t='+Date.now());items=j.items;st=j.settings}
async function go(k,edit){tab=k;await load();
if(k=='settings'){shell(`<div class="box" id="f">${fields(S_F,{...DEF,...st})}<button class="btn" id="sv">Save settings</button></div>`);wireUpload($('#f'));$('#sv').onclick=async()=>{await api('settings','PUT',collect($('#f')));msg='Settings saved';go('settings')};return}
if(k=='users'){const us=await api('users');shell(`<div class="box">${us.map(u=>`<div class="row"><span><b>${H(u.username)}</b> · ${u.role}</span><span><select data-r="${u.id}" style="display:inline;width:auto">${['admin','editor','coach'].map(r=>`<option ${u.role==r?'selected':''}>${r}</option>`).join('')}</select> <button class="btn sm k" data-p="${u.id}">Reset login</button> <button class="btn sm w" data-d="${u.id}">Delete</button></span></div>`).join('')}</div><div class="box" id="f"><h3>Invite a user</h3><p class="muted">You get a private link to send them. They choose their own password and scan their own QR code, so you never see either.</p><label>Username<input name="username"></label><label>Level<select name="role"><option value="coach">coach: fixtures, results and news</option><option value="editor">editor: all content and documents</option><option value="admin">admin: everything, including settings and users</option></select></label><button class="btn" id="ad">Create invite link</button></div>`);
document.querySelectorAll('[data-r]').forEach(s=>s.onchange=async()=>{try{await api('users/'+s.dataset.r,'PUT',{role:s.value});msg='Level changed'}catch(e){msg=H(e.message)}go('users')});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this user?')){try{await api('users/'+b.dataset.d,'DELETE');msg='User deleted'}catch(e){msg=H(e.message)}go('users')}});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{try{const j=await api('users/'+b.dataset.p+'/invite','POST');msg=inviteMsg(j.token,us.find(u=>u.id==b.dataset.p).username,true)}catch(e){msg=H(e.message)}go('users')});
$('#ad').onclick=async()=>{try{const d=collect($('#f'));const j=await api('invites','POST',d);msg=inviteMsg(j.token,d.username.toLowerCase())}catch(e){msg=H(e.message)}go('users')};return}
if(k=='messages'){const ms=await api('messages');shell(`<div class="box">${ms.map(m=>`<div class="row" style="align-items:flex-start"><div><b>${H(m.name)}</b> · <a href="mailto:${H(m.email)}">${H(m.email)}</a><br><small class="muted">${new Date(m.ts).toLocaleString('en-GB')} · ${m.sent?'emailed':'portal only'}</small><pre style="margin-top:8px">${H(m.msg)}</pre></div><button class="btn sm w" data-m="${m.id}">Delete</button></div>`).join('')||'<p class="muted">No messages yet.</p>'}</div>`);document.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this message?')){await api('messages/'+b.dataset.m,'DELETE');go('messages')}});return}
const c=K[k],cur=edit&&items.find(x=>x.id==edit)||{};
const list=items.filter(x=>x.kind==k).sort((a,b)=>c.desc?(a.sort<b.sort?1:-1):(a.sort<b.sort?-1:1));
shell(`<div class="box" id="f"><h3>${edit?'Edit':'Add'}</h3>${fields(c.f,cur)}<button class="btn" id="sv">Save</button>${edit?' <button class="btn w" id="cn">Cancel</button>':''}</div><div class="box">${list.map(i=>`<div class="row"><span>${H(c.l(i))}</span><span><button class="btn sm k" data-e="${i.id}">Edit</button> <button class="btn sm w" data-x="${i.id}">Delete</button></span></div>`).join('')||'<p class="muted">Nothing here yet.</p>'}</div>`);
wireUpload($('#f'));rollBox(k);
$('#sv').onclick=async()=>{const d=collect($('#f'));if(k=='team')d.slug=cur.slug||'t'+Date.now().toString(36);if(k=='page')d.slug=cur.slug||slug(d.title);const sort=k=='team'?String(d.age||0).padStart(2,'0'):(k=='member'||k=='role'||k=='page')?String(d.order||0).padStart(3,'0')+(d.name||d.title):String(d.date||d.title||d.name||'');try{await api(edit?'items/'+edit:'items',edit?'PUT':'POST',{kind:k,sort,data:d});msg='Saved'}catch(e){msg=H(e.message)}go(k)};
if(edit)$('#cn').onclick=()=>go(k);
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{go(k,b.dataset.e);scrollTo(0,0)});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this?')){try{await api('items/'+b.dataset.x,'DELETE');msg='Deleted'}catch(e){msg=H(e.message)}go(k)}})}
function form(title,fs,btn,fn,extra=''){$('#app').innerHTML=`<div class="box login"><h1 style="font-size:44px">${title}</h1>${extra}${fs}<p class="err" id="er"></p><button class="btn" id="go">${btn}</button></div>`;$('#go').onclick=async()=>{try{await fn(collect($('.login')))}catch(e){$('#er').textContent=e.message}}}
const LF='<label>Username<input name="username" autocomplete="username"></label><label>Password<input name="password" type="password" autocomplete="current-password"></label><label>Authenticator code (6 digits from the app)<input name="code" inputmode="numeric" autocomplete="one-time-code"></label>';
async function boot(){const inv=new URLSearchParams(location.search).get('invite');if(inv)return acceptInvite(inv);const j=await api('me');
if(j.setup)return form('Set up admin','<label>Username<input name="username"></label><label>Password (10 characters or more)<input name="password" type="password"></label>','Create admin',async d=>{const r=await api('setup','POST',d);qrScreen(r)});
if(!j.user)return form('Club login',LF,'Log in',async d=>{await api('login','POST',d);boot()});
me=j.user;go(can('settings')?'settings':'fixture')}
boot();
</script></body></html>
